<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reels preview | Scale Vibe</title>
<style>
:root{--g:linear-gradient(95deg,#FF9A4D,#F3677A 50%,#8E7CF0);
--f:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;font-family:var(--f);overflow:hidden}
.feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.feed::-webkit-scrollbar{display:none}
.reel{position:relative;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;justify-content:center;background:#000}
.col{position:relative;height:100%;width:min(100vw,calc(100dvh*9/16));overflow:hidden;background:linear-gradient(165deg,var(--c1),var(--c2))}
.poster{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.22);font-weight:800;font-size:clamp(48px,16vw,84px);letter-spacing:-.04em;text-align:center;padding:20px}
.col iframe{position:absolute;top:0;left:50%;height:100%;aspect-ratio:16/9;transform:translateX(-50%);border:0;pointer-events:none;opacity:0;transition:opacity .4s}
.col iframe.live{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.6),transparent 32%,transparent 50%,rgba(0,0,0,.82))}
.hook{position:absolute;left:18px;right:80px;top:calc(env(safe-area-inset-top,0px) + 74px);color:#fff;pointer-events:none}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);padding:5px 10px;border-radius:99px}
.hook h3{font-size:clamp(24px,7vw,30px);line-height:1.12;letter-spacing:-.02em;margin-top:10px;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.rail{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;flex-direction:column;gap:16px;align-items:center;z-index:3}
.rb{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;cursor:pointer;display:grid;place-items:center;text-decoration:none}
.rb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rl{font-size:10px;color:#fff;font-weight:600;margin-top:-10px}
.bar{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3;display:flex;flex-direction:column;gap:12px}
.cap{color:#fff;font-size:14px;line-height:1.4;text-shadow:0 1px 8px rgba(0,0,0,.5);padding-right:60px}
.cta{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:700;font-size:15px;padding:14px;border-radius:14px;background:var(--g)}
.top{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100dvh*9/16));z-index:10;padding:calc(env(safe-area-inset-top,0px) + 10px) 0 0;pointer-events:none}
.prog{height:3px;margin:0 14px 10px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px;scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;font:600 13px var(--f);padding:8px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:#fff;color:#1D1D1F}
</style>
</head>
<body>
<div class="top"><div class="prog"><i id="prog"></i></div><div class="chips" id="chips"></div></div>
<div class="feed" id="feed"></div>

<script>
// Each reel: replace yt with the Short's ID and ig with the Instagram reel link
var REELS=[
 {n:'Coaching',hook:'Run a coaching centre?',cap:'Batches, fee reminders and demo bookings, all on WhatsApp.',cta:'Get this for my coaching centre',yt:'SaKXPAmxi1E',ig:'https://instagram.com/',c:['#F3677A','#8E7CF0']},
 {n:'Dentist',hook:'Own a dental clinic?',cap:'Online appointment slots and review requests after every visit.',cta:'Get this for my clinic',yt:'PIpU-Qix_Es',ig:'https://instagram.com/',c:['#4FB3F6','#8E7CF0']},
 {n:'Salon',hook:'Run a salon?',cap:'Bookings in two taps and 5-star reviews posted to Google Maps.',cta:'Get this for my salon',yt:'Xh-Is8PPW1g',ig:'https://instagram.com/',c:['#FF9A4D','#F3677A']},
 {n:'Cafe',hook:'Own a cafe?',cap:'WhatsApp orders with zero commission. A QR code on every table.',cta:'Get this for my cafe',yt:'1Cdaad-4fOk',ig:'https://instagram.com/',c:['#C98B5A','#F3677A']},
 {n:'Restaurant',hook:'Run a restaurant?',cap:'Your own menu and ordering page. Skip the 30% app cut.',cta:'Get this for my restaurant',yt:'5NmxbWmYatU',ig:'https://instagram.com/',c:['#FF9A4D','#E5484D']},
 {n:'Retail',hook:'Have a retail shop?',cap:'A catalogue customers can browse and order from on WhatsApp.',cta:'Get this for my shop',yt:'VG5lc8kG12Y',ig:'https://instagram.com/',c:['#34C3A0','#4FB3F6']},
 {n:'Other',hook:'Have a different business?',cap:'Tell us what you sell and we will build the page around it.',cta:'Get this for my business',yt:'PkQ9meYBwIE',ig:'https://instagram.com/',c:['#8E7CF0','#4FB3F6']}
];
var ICON_OFF='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>';
var ICON_ON='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
var ICON_IG='<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>';
var feed=document.getElementById('feed'),chips=document.getElementById('chips'),prog=document.getElementById('prog');
var muted=true,active=-1;

REELS.forEach(function(r,i){
  var d=document.createElement('div');d.className='reel';d.dataset.i=i;
  d.innerHTML='<div class="col" style="--c1:'+r.c[0]+';--c2:'+r.c[1]+'"><div class="poster">'+r.n+'</div><div class="shade"></div>'
   +'<div class="hook"><span class="tag">'+r.n+'</span><h3>'+r.hook+'</h3></div>'
   +'<div class="rail"><button class="rb" data-mute aria-label="Sound">'+ICON_OFF+'</button>'
   +'<a class="rb" href="'+r.ig+'" target="_blank" rel="noopener" aria-label="Watch on Instagram">'+ICON_IG+'</a><div class="rl">Insta</div></div>'
   +'<div class="bar"><div class="cap">'+r.cap+'</div><a class="cta" href="#contact" data-biz="'+r.n+'">'+r.cta+'</a></div></div>';
  feed.appendChild(d);
  var c=document.createElement('button');c.className='chip';c.textContent=r.n;
  c.onclick=function(){feed.scrollTo({top:i*feed.clientHeight,behavior:'smooth'})};
  chips.appendChild(c);
});

function src(r){return 'https://www.youtube-nocookie.com/embed/'+r.yt+'?autoplay=1&mute='+(muted?1:0)+'&controls=0&loop=1&playlist='+r.yt+'&playsinline=1&modestbranding=1&rel=0&iv_load_policy=3'}

function activate(i){
  if(i===active)return;active=i;
  document.querySelectorAll('.reel').forEach(function(el,k){
    var col=el.querySelector('.col'),f=col.querySelector('iframe');
    if(k===i){
      if(!f){f=document.createElement('iframe');f.allow='autoplay; encrypted-media; picture-in-picture';f.referrerPolicy='strict-origin-when-cross-origin';f.setAttribute('allowfullscreen','');f.title=REELS[k].n+' reel';f.src=src(REELS[k]);
        f.onload=function(){f.classList.add('live')};col.insertBefore(f,col.querySelector('.shade'))}
    }else if(f){f.remove()}
  });
  var cs=document.querySelectorAll('.chip');
  cs.forEach(function(c,k){c.classList.toggle('on',k===i)});
  cs[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  prog.style.width=((i+1)/REELS.length*100)+'%';
}

var io=new IntersectionObserver(function(es){
  es.forEach(function(e){if(e.isIntersecting&&e.intersectionRatio>.6)activate(+e.target.dataset.i)});
},{root:feed,threshold:[.6]});
document.querySelectorAll('.reel').forEach(function(el){io.observe(el)});

feed.addEventListener('click',function(e){
  var b=e.target.closest('[data-mute]');
  if(b){muted=!muted;
    document.querySelectorAll('[data-mute]').forEach(function(x){x.innerHTML=muted?ICON_OFF:ICON_ON});
    var f=document.querySelector('.reel iframe');if(f)f.src=src(REELS[active]);}
  var a=e.target.closest('[data-biz]');
  if(a){e.preventDefault();alert('In the real site this scrolls to the contact form with Business type set to '+a.dataset.biz+'.')}
});
activate(0);
</script>
</body>
</html>
